[package]
name = "wsl-tools"
version = "0.1.0"
description = "Minimal WSL management desktop app"
authors = ["WSL Tools"]
edition = "2021"

[lib]
name = "wsl_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
thiserror = "2"
regex = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
encoding_rs = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
